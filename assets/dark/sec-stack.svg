<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="56" viewBox="0 0 1000 56"><style>@font-face{font-family:JM;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PS;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:PS;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes pulse{0%{r:4;opacity:.7}100%{r:11;opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.flow{stroke-dasharray:4 6;animation:dash 1.1s linear infinite}
.pulse{animation:pulse 1.8s ease-out infinite}
.cur{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.cur,.spin{animation:none}}
